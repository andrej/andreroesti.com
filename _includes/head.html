	<meta charset="utf-8" />
{%- if page.url == "/" || page.url == "/index.html" %}
	<title>{{ site.title }}</title>
{%- else %}
	<title>{{ page.title }} - {{ site.title }}</title>
{%- endif %}
	<link rel="stylesheet" type="text/css" href="{{ '/assets/css/style.css' | relative_url }}" />
	<link rel="stylesheet" type="text/css" href="{{ '/assets/css/highlight.css' | relative_url }}" />
{%- for addl_style in page.additional_styles %}
	<link rel="stylesheet" type="text/css" href="{{addl_style | relative_url }}" />
{%- endfor %}
	<script src="{{ '/assets/js/email.js' | relative_url }}"></script>
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="theme-color" content="#000000" />
	<link rel="shortcut icon" type="image/png" href="{{ '/assets/logo/favicon.png' | relative_url }}" sizes="any" />
	<link rel="shortcut icon" type="image/svg+xml" href="{{ '/assets/logo/favicon.svg' | relative_url }}" />
	<link rel="apple-touch-icon" type="image/png" href="{{ '/assets/logo/touch-icon.png' | relative_url }}" />
